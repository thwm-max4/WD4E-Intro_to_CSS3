<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Liên hệ</title>

    <link rel="stylesheet" href="style2.css">
</head>

<body>

    <!-- Yêu cầu 3: position + focus -->
    <a href="#main-content" class="skip-link">
        Chuyển đến Nội dung chính
    </a>


    <!-- NAVIGATION -->
    <header>

        <nav class="navbar">

            <div class="logo">
                My Little Corner
            </div>

            <ul class="nav-links">

                <li>
                    <a href="index.html">
                        Trang chủ
                    </a>
                </li>

                <li>
                    <a href="gallery.html">
                        Bộ sưu tập
                    </a>
                </li>

                <li>
                    <a href="contact.html">
                        Liên hệ
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- MAIN -->
    <main id="main-content">

        <section class="section">

            <h1>Liên hệ với tôi</h1>

            <p>
                Nếu bạn muốn gửi lời nhắn, hãy điền thông tin bên dưới.
            </p>


            <div class="form-box">

                <form>

                    <label for="name">
                        Họ và tên
                    </label>

                    <input type="text" id="name" name="name" placeholder="Nhập họ và tên">


                    <label for="email">
                        Email
                    </label>

                    <input type="email" id="email" name="email" placeholder="Nhập email">


                    <label for="message">
                        Lời nhắn
                    </label>

                    <textarea id="message" name="message" placeholder="Nhập lời nhắn của bạn">
                    </textarea>


                    <button type="submit" class="button">
                        Gửi lời nhắn
                    </button>

                </form>

            </div>

        </section>


        <section class="section">

            <h2>Một góc thư giãn</h2>

            <img src="https://picsum.photos/id/1040/900/500" alt="Phong cảnh núi và hồ">

        </section>

    </main>


    <footer>
        <p>© 2026 My Little Corner</p>
    </footer>

</body>

</html>
